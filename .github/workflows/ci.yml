name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify
        run: npm run verify:ci

      - name: Prod dependency audit
        run: npm run audit:prod

      - name: Post-deploy production smoke
        env:
          QA_BASE_URL: ${{ secrets.QA_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ENGINE_LOOP_SECRET: ${{ secrets.ENGINE_LOOP_SECRET }}
        run: |
          if [ -z "$QA_BASE_URL" ]; then
            echo "Skipping post-deploy smoke: QA_BASE_URL is not configured."
            exit 0
          fi
          if [ -z "$CRON_SECRET" ] && [ -z "$ENGINE_LOOP_SECRET" ]; then
            echo "Skipping post-deploy smoke: refresh secret is not configured."
            exit 0
          fi
          npm run qa:post-deploy

      - name: Trading production audit
        env:
          QA_BASE_URL: ${{ secrets.QA_BASE_URL }}
          QA_SIGN_IN_URL: ${{ secrets.QA_SIGN_IN_URL }}
          QA_CLERK_USER_ID: ${{ secrets.QA_CLERK_USER_ID }}
          QA_CLERK_EMAIL: ${{ secrets.QA_CLERK_EMAIL }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
        run: |
          if [ -z "$QA_SIGN_IN_URL" ] && { [ -z "$CLERK_SECRET_KEY" ] || { [ -z "$QA_CLERK_USER_ID" ] && [ -z "$QA_CLERK_EMAIL" ]; }; }; then
            echo "Skipping trading production audit: QA auth is not configured."
            exit 0
          fi
          npm run qa:trading:prod

      - name: Billing entitlement audit
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          SC_OWNER_USER_ID: ${{ secrets.SC_OWNER_USER_ID }}
          SC_OWNER_USER_IDS: ${{ secrets.SC_OWNER_USER_IDS }}
        run: |
          if [ -z "$CLERK_SECRET_KEY" ]; then
            echo "Skipping billing audit: CLERK_SECRET_KEY is not configured."
            exit 0
          fi
          npm run qa:billing:strict
