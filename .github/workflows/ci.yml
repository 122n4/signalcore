name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Full dependency audit
        run: npm audit --audit-level=low

      - name: Prod dependency audit
        run: npm run audit:prod

  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || 'pk_test_Y2xlcmsuY2kuZHVtbXkk' }}
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify
        run: npm run verify:ci

      - name: Prod dependency audit
        run: npm run audit:prod

      - name: Post-deploy production smoke
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          QA_BASE_URL: https://signalcore.vercel.app
          QA_SCANNER_REFRESH_SECRET: ${{ secrets.QA_SCANNER_REFRESH_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ENGINE_LOOP_SECRET: ${{ secrets.ENGINE_LOOP_SECRET }}
        run: |
          if [ -z "$QA_BASE_URL" ]; then
            echo "Post-deploy smoke cannot run: QA_BASE_URL is not configured."
            exit 1
          fi
          if [ -z "$QA_SCANNER_REFRESH_SECRET" ] && [ -z "$CRON_SECRET" ] && [ -z "$ENGINE_LOOP_SECRET" ]; then
            echo "Post-deploy smoke cannot run: QA_SCANNER_REFRESH_SECRET, CRON_SECRET, or ENGINE_LOOP_SECRET is not configured."
            exit 1
          fi
          npm run qa:post-deploy

      - name: Install Playwright Chromium for Trading audit
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npx playwright install --with-deps chromium

      - name: Trading production audit
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          QA_BASE_URL: https://signalcore.vercel.app
          QA_SIGN_IN_URL: ${{ secrets.QA_SIGN_IN_URL }}
          QA_CLERK_USER_ID: ${{ secrets.QA_CLERK_USER_ID }}
          QA_CLERK_EMAIL: ${{ secrets.QA_CLERK_EMAIL }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          SC_OWNER_USER_ID: ${{ secrets.SC_OWNER_USER_ID }}
          SC_OWNER_USER_IDS: ${{ secrets.SC_OWNER_USER_IDS }}
        run: |
          if [ -z "$QA_SIGN_IN_URL" ] && [ -z "$CLERK_SECRET_KEY" ]; then
            echo "Trading production audit cannot run: QA_SIGN_IN_URL or CLERK_SECRET_KEY is required."
            exit 1
          fi
          node -r ./scripts/register-alias.cjs ./node_modules/jiti/bin/jiti.js scripts/qa/tradingProductionAuditBootstrap.ts

      - name: Billing entitlement audit
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          SC_OWNER_USER_ID: ${{ secrets.SC_OWNER_USER_ID }}
          SC_OWNER_USER_IDS: ${{ secrets.SC_OWNER_USER_IDS }}
        run: |
          if [ -z "$CLERK_SECRET_KEY" ]; then
            echo "Billing audit cannot run: CLERK_SECRET_KEY is not configured."
            exit 1
          fi
          npm run qa:billing:strict
