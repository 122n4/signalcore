name: I4C audit read policy patch

on:
  push:
    branches:
      - fix/investing-genesis-rehearsal-gates-20260905

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'fix(investing): add I4-C audit read policy for deferred guards') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/investing-genesis-rehearsal-gates-20260905
      - name: Patch I4-C and contract test
        run: |
          python - <<'PY'
          from pathlib import Path

          sql_path = Path('docs/investing-genesis/sql/I4C_PLAN_RUNTIME_WRITER_CANDIDATE.sql')
          test_path = Path('tests/investingGenesisI4PlanRuntimeWriterCandidate.test.ts')
          sql = sql_path.read_text()
          test = test_path.read_text()

          anchor = "create policy audit_events_i4c_plan_success_insert\n"
          assert sql.count(anchor) == 1, sql.count(anchor)
          policy = """create policy audit_events_i4c_plan_select
  on investing.audit_events
  for select
  to investing_app
  using (
    actor_kind = 'USER_PRINCIPAL'
    and actor_id = current_setting('syntrake.investing.actor_id', true)
    and principal_id = nullif(current_setting('syntrake.investing.principal_id', true), '')::uuid
    and operation_scope = 'ACCOUNT_SCOPE'
    and tenant_id = nullif(current_setting('syntrake.investing.tenant_id', true), '')::uuid
    and account_id = nullif(current_setting('syntrake.investing.account_id', true), '')::uuid
    and action = case current_setting('syntrake.investing.operation', true)
      when 'PLAN_INITIALIZE_V1' then 'PLAN_INITIALIZATION_SUCCEEDED'
      when 'PLAN_CREATE_AND_ACTIVATE_REVISION_V1' then 'PLAN_REVISION_ACTIVATED'
      else '__INVALID__'
    end
    and object_type = 'PLAN_REVISION'
    and object_id = current_setting('syntrake.investing.plan_revision_id', true)
    and outcome = 'SUCCEEDED'
    and reason_code is null
    and investing.i4_plan_runtime_context_authorized_v1()
  );

"""
          sql = sql.replace(anchor, policy + anchor, 1)

          list_anchor = "      'audit_events_i4c_plan_success_insert'\n"
          assert sql.count(list_anchor) == 1, sql.count(list_anchor)
          sql = sql.replace(list_anchor, "      'audit_events_i4c_plan_select',\n" + list_anchor, 1)

          assert sql.count("if v_policy_count <> 11 then") == 1
          sql = sql.replace("if v_policy_count <> 11 then", "if v_policy_count <> 12 then", 1)

          assert test.count("expect(policyCreates).toHaveLength(11);") == 1
          test = test.replace("expect(policyCreates).toHaveLength(11);", "expect(policyCreates).toHaveLength(12);", 1)
          assert test.count('expect(sql).toContain("if v_policy_count <> 11 then");') == 1
          test = test.replace('expect(sql).toContain("if v_policy_count <> 11 then");', 'expect(sql).toContain("if v_policy_count <> 12 then");', 1)
          test = test.replace('it("requires exactly eleven investing_app I4-C policies in postconditions", () => {', 'it("requires exactly twelve investing_app I4-C policies in postconditions", () => {', 1)
          marker = 'expect(sql).toContain("plan_revision_activated");'
          assert test.count(marker) == 1
          test = test.replace(marker, marker + '\n    expect(sql).toContain("create policy audit_events_i4c_plan_select");', 1)

          assert sql.count('create policy audit_events_i4c_plan_select') == 1
          assert sql.count('create policy ') == 12
          sql_path.write_text(sql)
          test_path.write_text(test)
          PY
      - name: Commit patch
        run: |
          git config user.name "122n4"
          git config user.email "112497100+122n4@users.noreply.github.com"
          git add docs/investing-genesis/sql/I4C_PLAN_RUNTIME_WRITER_CANDIDATE.sql tests/investingGenesisI4PlanRuntimeWriterCandidate.test.ts
          git diff --cached --check
          git commit -m "fix(investing): add I4-C audit read policy for deferred guards"
          git push origin HEAD:fix/investing-genesis-rehearsal-gates-20260905
