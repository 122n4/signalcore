name: I4-C Reconciliation Static Gate

on:
  push:
    branches:
      - fix/i4c-contract-reconciliation-20260906

permissions:
  contents: write

env:
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuY2kuZHVtbXkk
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  writer-repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Patch stale writer material-equivalent replay
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('lib/investing/plan/writer.ts')
          text = path.read_text()
          start_marker = 'async function resolveCreateAndActivateStaleRace('
          end_marker = '\nasync function dispatchExistingIdempotency('
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('stale race function boundary missing')
          segment = text[start:end]
          old = '''  return terminalSuccess(client, input.idempotencyRecordId, {
            planRootId: row.plan_root_id,
            planRevisionId: row.plan_revision_id,
            activeVersion: row.revision_number,
            planRevisionContentHash: row.plan_revision_content_hash,
          }, true);'''
          new = '''  // Exact replay is handled earlier by the original idempotency key. A fresh
          // idempotency record that arrives after another writer advanced the same
          // predecessor is a stale writer and must lose, even when material bytes match.
          return fail("CONFLICT");'''
          if new in segment:
              print('writer already repaired')
              raise SystemExit(0)
          count = segment.count(old)
          if count != 1:
              raise SystemExit(f'expected one stale replay block, found {count}')
          segment = segment.replace(old, new, 1)
          path.write_text(text[:start] + segment + text[end:])
          PY
          git diff --check
      - name: Commit repair if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No repair commit required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/investing/plan/writer.ts
          git commit -m 'fix(investing): reject stale writer material-equivalent replay'
          git push origin HEAD:fix/i4c-contract-reconciliation-20260906

  i4-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: I4 reconciliation tests
        run: >-
          npx vitest run
          tests/investingGenesisI4PlanPersistenceCandidate.test.ts
          tests/investingGenesisI4PlanWriterCandidate.test.ts
          tests/investingGenesisI4PlanWriterPg17Reconciliation.test.ts
          tests/investingGenesisI4PlanServiceBoundary.test.ts
          tests/investingGenesisI4PredecessorContract.test.ts
          tests/investingGenesisI4ColumnAclNullRegression.test.ts
          tests/investingGenesisI4PolicyRoleTypeContract.test.ts
          tests/investingGenesisI4PolicyFingerprintContract.test.ts

  i4-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint I4 reconciliation perimeter
        run: npx eslint lib/investing/plan tests/investingGenesisI4*.test.ts

  baseline-lint-reference:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact I4-B baseline
        uses: actions/checkout@v4
        with:
          ref: 812b2ea11f8696abcc55f00d70beff85f0701733
      - name: Prove baseline SHA
        run: test "$(git rev-parse HEAD)" = "812b2ea11f8696abcc55f00d70beff85f0701733"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Baseline lint reference
        shell: bash
        run: |
          set +e
          npm run lint
          status=$?
          echo "BASELINE_LINT_EXIT=$status"
          exit 0

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: TypeScript
        shell: bash
        run: |
          set -o pipefail
          npx tsc --noEmit 2>&1 | tee i4-typecheck.log
      - name: Upload typecheck diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i4-typecheck-diagnostics
          path: i4-typecheck.log

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee i4-build.log
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i4-build-diagnostics
          path: i4-build.log

  i0-i4-pg17-rehearsal:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      PG17_REHEARSAL_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      SYNTRAKE_I3_SYNTHETIC_REHEARSAL_ENABLED: "true"
      SYNTRAKE_I3_REHEARSAL_PROJECT_REF: local-pg17
      VERCEL_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prove rehearsal SHA
        run: git rev-parse HEAD
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: PostgreSQL version
        run: psql "$PG17_REHEARSAL_URL" -v ON_ERROR_STOP=1 -c "select version();"
      - name: I0 through I4 complete PostgreSQL 17 rehearsal
        run: npx vitest run tests/investingGenesisI0ToI4Pg17Rehearsal.test.ts --reporter=verbose
