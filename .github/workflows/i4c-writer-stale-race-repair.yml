name: I4-C Writer Stale Race Repair

on:
  push:
    branches:
      - fix/i4c-contract-reconciliation-20260906

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]' || github.event.head_commit.message != 'fix(investing): reject stale writer material-equivalent replay'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Patch stale-writer semantics fail-closed
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('lib/investing/plan/writer.ts')
          text = path.read_text()
          start_marker = 'async function resolveCreateAndActivateStaleRace('
          end_marker = '\nasync function dispatchExistingIdempotency('
          start = text.find(start_marker)
          if start < 0:
              raise SystemExit('missing resolveCreateAndActivateStaleRace')
          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit('missing dispatchExistingIdempotency boundary')
          segment = text[start:end]
          old = '''  return terminalSuccess(client, input.idempotencyRecordId, {
            planRootId: row.plan_root_id,
            planRevisionId: row.plan_revision_id,
            activeVersion: row.revision_number,
            planRevisionContentHash: row.plan_revision_content_hash,
          }, true);'''
          new = '''  // Exact replay is handled earlier by the original idempotency key. A fresh
          // idempotency record that arrives after another writer advanced the same
          // predecessor is a stale writer and must lose, even when material bytes match.
          return fail("CONFLICT");'''
          if new in segment:
              print('writer already repaired')
              raise SystemExit(0)
          count = segment.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one stale-race replay block, found {count}')
          segment = segment.replace(old, new, 1)
          path.write_text(text[:start] + segment + text[end:])
          PY
          git diff --check
      - name: Install
        if: success()
        run: npm ci
      - name: Writer regression tests
        if: success()
        run: npx vitest run tests/investingGenesisI4PlanWriterCandidate.test.ts tests/investingGenesisI4PlanServiceBoundary.test.ts
      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No repair commit required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/investing/plan/writer.ts
          git commit -m 'fix(investing): reject stale writer material-equivalent replay'
          git push origin HEAD:fix/i4c-contract-reconciliation-20260906
