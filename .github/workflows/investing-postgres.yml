name: Investing PostgreSQL invariants

on:
  pull_request:
    paths:
      - "app/api/investing/**"
      - "lib/investing/**"
      - "scripts/qa/runInvesting*.mjs"
      - "scripts/qa/investingDestructiveQaGuard.*"
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "tests/investingEnginePhase4B*.test.ts"
      - "tests/investingPlanPersistenceWriter*.test.ts"
      - "tests/investingPlanPersistenceServerBoundary*.test.ts"
      - ".github/workflows/investing-postgres.yml"
  workflow_dispatch:

jobs:
  investing-db:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install validation dependencies
        run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase and apply all migrations from zero
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor
      - name: Reset schema from migrations
        run: supabase db reset --local
      - name: Capture Investing ACL fidelity diagnostics
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -f supabase/tests/investing_acl_fidelity_snapshot.sql
      - name: Run Investing PostgreSQL assertions
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -f supabase/tests/investing_p0_p1.sql
      - name: Run canonical Investing Plan persistence schema assertions
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/investing_plan_persistence_schema.sql
      - name: Run canonical Investing Plan persistence writer assertions
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/investing_plan_persistence_writer.sql
      - name: Run Investing security, RLS, Live and accounting assertions
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -f supabase/tests/investing_security_accounting.sql
      - name: Run Investing rollback and recovery assertions
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -f supabase/tests/investing_rollback_recovery.sql
      - name: Run Investing material reconciliation-break assertions
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -f supabase/tests/investing_reconciliation_breaks.sql
      - name: Run Investing Engine FASE 4A schema, RLS and append-only assertions
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -f supabase/tests/investing_engine_phase4a.sql
      - name: Run Investing Engine FASE 4B-R1 authorization assertions
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -f supabase/tests/investing_engine_phase4b_r1.sql
      - name: Run Investing Engine FASE 4B-R2 root sealing assertions
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -f supabase/tests/investing_engine_phase4b_r2.sql
      - name: Run Investing Engine FASE 4B-R3 raw boundary assertions
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -f supabase/tests/investing_engine_phase4b_r3.sql
      - name: Run Investing Engine FASE 4B-R4 final conditions assertions
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -f supabase/tests/investing_engine_phase4b_r4.sql
      - name: Run Investing Engine FASE 4B-R5 empty-state transition assertions
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -f supabase/tests/investing_engine_phase4b_r5.sql
      - name: Run real multi-session concurrency assertions
        env:
          INVESTING_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: node scripts/qa/runInvestingPostgresConcurrency.mjs
      - name: Run Investing Engine FASE 4A idempotency concurrency assertions
        env:
          INVESTING_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: node scripts/qa/runInvestingEnginePhase4AConcurrency.mjs
      - name: Create disposable FASE 4B QA database
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          dropdb --if-exists --force -h 127.0.0.1 -p 54322 -U postgres investing_4b_qa
          createdb -h 127.0.0.1 -p 54322 -U postgres investing_4b_qa
          db_container="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -n 1)"
          test -n "$db_container"
          docker exec "$db_container" pg_dump --schema-only --no-owner "postgresql://postgres:postgres@127.0.0.1:5432/postgres" \
            | grep -Ev 'log_min_messages|pg_stat_statements_reset|pg_catalog\.pg_|WITH GRANT OPTION|ALTER DEFAULT PRIVILEGES' \
            | psql "postgresql://postgres:postgres@127.0.0.1:54322/investing_4b_qa" -v ON_ERROR_STOP=1
      - name: Run Investing Engine FASE 4B persistence, replay and corruption assertions
        env:
          INVESTING_4B_TEST_DATABASE_URL: postgresql://127.0.0.1:54322/investing_4b_qa
          ALLOW_DESTRUCTIVE_INVESTING_QA: "true"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: npx vitest run tests/investingEnginePhase4BPersistence.test.ts tests/investingEnginePhase4BIntegrityReplay.test.ts tests/investingEnginePhase4BIsolation.test.ts tests/investingEnginePhase4BPostgres.integration.test.ts
      - name: Drop disposable FASE 4B QA database
        if: always()
        env:
          PGPASSWORD: postgres
        run: dropdb --if-exists --force -h 127.0.0.1 -p 54322 -U postgres investing_4b_qa
      - name: Create disposable A3D QA database
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          dropdb --if-exists --force -h 127.0.0.1 -p 54322 -U postgres investing_a3d_qa
          createdb -h 127.0.0.1 -p 54322 -U postgres investing_a3d_qa
          db_container="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -n 1)"
          test -n "$db_container"
          docker exec "$db_container" pg_dump --schema-only --no-owner "postgresql://postgres:postgres@127.0.0.1:5432/postgres" \
            | grep -Ev 'log_min_messages|pg_stat_statements_reset|pg_catalog\.pg_|WITH GRANT OPTION|ALTER DEFAULT PRIVILEGES' \
            | psql "postgresql://postgres:postgres@127.0.0.1:54322/investing_a3d_qa" -v ON_ERROR_STOP=1
      - name: Run canonical Investing Plan writer real multi-session PostgreSQL assertions
        env:
          INVESTING_A3D_TEST_DATABASE_URL: postgresql://127.0.0.1:54322/investing_a3d_qa
          ALLOW_DESTRUCTIVE_INVESTING_QA: "true"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: npx vitest run tests/investingPlanPersistenceWriterPostgres.integration.test.ts
      - name: Drop disposable A3D QA database
        if: always()
        env:
          PGPASSWORD: postgres
        run: dropdb --if-exists --force -h 127.0.0.1 -p 54322 -U postgres investing_a3d_qa
      - name: Export local Supabase service-role RPC environment
        run: |
          set -euo pipefail
          env_output="$(supabase status -o env)"
          printf '%s\n' "$env_output"
          api_url="$(printf '%s\n' "$env_output" | sed -nE 's/^(API_URL|SUPABASE_URL|NEXT_PUBLIC_SUPABASE_URL)=//p' | head -n 1)"
          service_role_key="$(printf '%s\n' "$env_output" | sed -nE 's/^(SERVICE_ROLE_KEY|SUPABASE_SERVICE_ROLE_KEY)=//p' | head -n 1)"
          api_url="${api_url%\"}"
          api_url="${api_url#\"}"
          service_role_key="${service_role_key%\"}"
          service_role_key="${service_role_key#\"}"
          test -n "$api_url"
          test -n "$service_role_key"
          {
            echo "SUPABASE_URL=$api_url"
            echo "NEXT_PUBLIC_SUPABASE_URL=$api_url"
            echo "SUPABASE_SERVICE_ROLE_KEY=$service_role_key"
          } >> "$GITHUB_ENV"
      - name: Run canonical Investing Plan server persistence boundary real Supabase RPC assertions
        env:
          INVESTING_A3E_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: npx vitest run tests/investingPlanPersistenceServerBoundaryPostgres.integration.test.ts
      - name: Run real separate-worker crash recovery assertions
        env:
          INVESTING_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: node scripts/qa/runInvestingWorkerCrashRecovery.mjs
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
