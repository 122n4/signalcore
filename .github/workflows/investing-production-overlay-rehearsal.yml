name: Investing production migration overlay rehearsal

on:
  pull_request:
    paths:
      - "supabase/migrations/20260812133000_investing_db_security_hardening_phase1.sql"
      - "supabase/migrations/20260813201607_investing_split_effective_time_truth.sql"
      - "supabase/migrations/20260816202000_investing_canonical_plan_persistence_schema.sql"
      - "supabase/tests/investing_production_overlay_*.sql"
      - ".github/workflows/investing-production-overlay-rehearsal.yml"
  workflow_dispatch:

jobs:
  overlay-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install validation dependencies
        run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.114.0
      - name: Show exact Supabase CLI migration help
        run: |
          supabase --version
          supabase db reset --help
          supabase db push --help
          supabase migration list --help
          supabase migration --help
          supabase migration up --help
      - name: Start local Supabase
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor
      - name: Materialize local schema at production migration max
        run: supabase db reset --local --version 20260812132000 --no-seed
      - name: Assert production-max pre-state and capture fixtures
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/investing_production_overlay_prestate.sql
      - name: Apply 20260812133000 security hardening overlay
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/migrations/20260812133000_investing_db_security_hardening_phase1.sql
      - name: Assert 20260812133000 security overlay effects
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/investing_production_overlay_after_security.sql
      - name: Apply 20260813201607 split effective-time overlay
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/migrations/20260813201607_investing_split_effective_time_truth.sql
      - name: Assert 20260813201607 split effective-time effects
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/investing_production_overlay_after_split.sql
      - name: Apply 20260816202000 canonical Plan schema overlay
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/migrations/20260816202000_investing_canonical_plan_persistence_schema.sql
      - name: Assert 20260816202000 canonical Plan overlay effects
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/investing_production_overlay_after_a3c.sql
      - name: Run canonical Investing Plan persistence schema assertions
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/investing_plan_persistence_schema.sql
      - name: Run Investing PostgreSQL assertions
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/investing_p0_p1.sql
      - name: Run Investing security, RLS, Live and accounting assertions
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/investing_security_accounting.sql
      - name: Run Investing rollback and recovery assertions
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/investing_rollback_recovery.sql
      - name: Run Investing material reconciliation-break assertions
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/investing_reconciliation_breaks.sql
      - name: Run Investing Engine FASE 4A schema, RLS and append-only assertions
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/investing_engine_phase4a.sql
      - name: Run Investing Engine FASE 4B-R1 authorization assertions
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/investing_engine_phase4b_r1.sql
      - name: Run Investing Engine FASE 4B-R2 root sealing assertions
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/investing_engine_phase4b_r2.sql
      - name: Run Investing Engine FASE 4B-R3 raw boundary assertions
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/investing_engine_phase4b_r3.sql
      - name: Run Investing Engine FASE 4B-R4 final conditions assertions
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/investing_engine_phase4b_r4.sql
      - name: Run Investing Engine FASE 4B-R5 empty-state transition assertions
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/investing_engine_phase4b_r5.sql
      - name: Run real multi-session concurrency assertions
        env:
          INVESTING_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: node scripts/qa/runInvestingPostgresConcurrency.mjs
      - name: Run Investing Engine FASE 4A idempotency concurrency assertions
        env:
          INVESTING_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: node scripts/qa/runInvestingEnginePhase4AConcurrency.mjs
      - name: Create disposable FASE 4B QA database
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          dropdb --if-exists --force -h 127.0.0.1 -p 54322 -U postgres investing_4b_qa
          createdb -h 127.0.0.1 -p 54322 -U postgres investing_4b_qa
          db_container="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -n 1)"
          test -n "$db_container"
          docker exec "$db_container" pg_dump --schema-only --no-owner "postgresql://postgres:postgres@127.0.0.1:5432/postgres" \
            | grep -Ev 'log_min_messages|pg_stat_statements_reset|pg_catalog\.pg_|WITH GRANT OPTION|ALTER DEFAULT PRIVILEGES' \
            | psql "postgresql://postgres:postgres@127.0.0.1:54322/investing_4b_qa" -v ON_ERROR_STOP=1
      - name: Run Investing Engine FASE 4B persistence, replay and corruption assertions
        env:
          INVESTING_4B_TEST_DATABASE_URL: postgresql://127.0.0.1:54322/investing_4b_qa
          ALLOW_DESTRUCTIVE_INVESTING_QA: "true"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: npx vitest run tests/investingEnginePhase4BPersistence.test.ts tests/investingEnginePhase4BIntegrityReplay.test.ts tests/investingEnginePhase4BIsolation.test.ts tests/investingEnginePhase4BPostgres.integration.test.ts
      - name: Drop disposable FASE 4B QA database
        if: always()
        env:
          PGPASSWORD: postgres
        run: dropdb --if-exists --force -h 127.0.0.1 -p 54322 -U postgres investing_4b_qa
      - name: Run real separate-worker crash recovery assertions
        env:
          INVESTING_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: node scripts/qa/runInvestingWorkerCrashRecovery.mjs
      - name: Reset again to production max before migration-engine rehearsal
        run: supabase db reset --local --version 20260812132000 --no-seed
      - name: Assert migration-engine pre-state and capture fixtures
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/investing_production_overlay_prestate.sql
      - name: Assert exactly three local migrations are pending after production max
        run: |
          set -euo pipefail
          expected="20260812133000 20260813201607 20260816202000"
          actual="$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' \
            | awk -F_ '$1 > 20260812132000 { print $1 }' \
            | sort \
            | paste -sd ' ' -)"
          test "$actual" = "$expected"
      - name: Demonstrate migration-engine pending set
        run: |
          set -euo pipefail
          supabase migration list --local 2>&1 | tee /tmp/r6_overlay_migration_list_pre.txt
          supabase db push --local --dry-run 2>&1 | tee /tmp/r6_overlay_db_push_dry_run.txt
          for version in 20260812133000 20260813201607 20260816202000; do
            grep -q "$version" /tmp/r6_overlay_db_push_dry_run.txt
          done
          unexpected="$(grep -Eo '20[0-9]{12}' /tmp/r6_overlay_db_push_dry_run.txt \
            | sort -u \
            | grep -Ev '^(20260812133000|20260813201607|20260816202000)$' || true)"
          test -z "$unexpected"
      - name: Apply pending overlays through Supabase migration engine
        run: supabase db push --local --yes
      - name: Assert migration-engine history and final schema state
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/investing_production_overlay_after_migration_engine.sql
      - name: Reassert security overlay after migration-engine application
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/investing_production_overlay_after_security.sql
      - name: Reassert split effective-time behavior after migration-engine application
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/investing_production_overlay_after_split.sql
      - name: Reassert canonical Plan schema after migration-engine application
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/investing_production_overlay_after_a3c.sql
      - name: Rerun canonical Investing Plan persistence schema assertions after migration-engine application
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/investing_plan_persistence_schema.sql
      - name: Rerun final Investing PostgreSQL assertions after migration-engine application
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/investing_p0_p1.sql
      - name: Rerun final Investing security, RLS, Live and accounting assertions after migration-engine application
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/investing_security_accounting.sql
      - name: Rerun final Investing rollback and recovery assertions after migration-engine application
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/investing_rollback_recovery.sql
      - name: Rerun final Investing material reconciliation-break assertions after migration-engine application
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/investing_reconciliation_breaks.sql
      - name: Rerun final Investing Engine FASE 4A schema, RLS and append-only assertions after migration-engine application
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/investing_engine_phase4a.sql
      - name: Rerun final Investing Engine FASE 4B-R1 authorization assertions after migration-engine application
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/investing_engine_phase4b_r1.sql
      - name: Rerun final Investing Engine FASE 4B-R2 root sealing assertions after migration-engine application
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/investing_engine_phase4b_r2.sql
      - name: Rerun final Investing Engine FASE 4B-R3 raw boundary assertions after migration-engine application
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/investing_engine_phase4b_r3.sql
      - name: Rerun final Investing Engine FASE 4B-R4 final conditions assertions after migration-engine application
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/investing_engine_phase4b_r4.sql
      - name: Rerun final Investing Engine FASE 4B-R5 empty-state transition assertions after migration-engine application
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/investing_engine_phase4b_r5.sql
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
