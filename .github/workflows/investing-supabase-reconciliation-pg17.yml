name: Investing Supabase Reconciliation PG17

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "tests/investingSupabaseReconciliationCandidate.test.ts"
      - "tests/investingSupabaseReconciliationPg17.test.ts"
      - "tests/investingGenesisI5ExperimentScientificClosurePg17.test.ts"
      - "tests/investingGenesisI5DatasetRunScientificClosurePg17.test.ts"
      - "tests/investingGenesisI5ResearchExecutionClosurePg17.test.ts"
      - "tests/investingGenesisCumulativeCompatibilityPg17.test.ts"
      - "tests/investingGenesisI5Rl2ResearchPassportPg17.test.ts"
      - "tests/investingGenesisI5Rl3bValidationChildExecutionPg17.test.ts"
      - "tests/investingGenesisI5Rl3cValidationAggregatePg17.test.ts"
      - "tests/investingGenesisI5Rl3dValidationAssessmentPg17.test.ts"
      - "tests/investingGenesisI5Rl7ExperimentComparisonPg17.test.ts"
      - "tests/investingGenesisI5Rl8c1ScientificPromotionPg17.test.ts"
      - "tests/investingGenesisI5Rl8c2ScientificPromotionWritersPg17.test.ts"
      - "tests/investingGenesisI5Rl9b1BlindTruthPersistencePg17.test.ts"
      - "tests/investingGenesisI5Rl9b2BlindTruthWritersPg17.test.ts"
      - "tests/support/investingEngineV2GoldenFixture.ts"
      - "tests/support/investingI5ExperimentScientificFixtures.ts"
      - "lib/investing/research/**"
      - "lib/investing/authority/**"
      - "package.json"
      - "package-lock.json"
      - "vitest.config.ts"
      - "docs/investing-genesis/SUPABASE_RECONCILIATION_CANDIDATE_20260915.md"
      - ".github/workflows/investing-supabase-reconciliation-pg17.yml"

jobs:
  investing-pg17-reconciliation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      PG17_RECONCILIATION_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Static reconciliation contract
        run: npx vitest run tests/investingSupabaseReconciliationCandidate.test.ts

      - name: PostgreSQL 17 reconciliation and Genesis/I5 rehearsal
        run: npx vitest run tests/investingSupabaseReconciliationPg17.test.ts

      - name: PostgreSQL 17 Experiment scientific closure rehearsal
        run: npx vitest run tests/investingGenesisI5ExperimentScientificClosurePg17.test.ts

      - name: PostgreSQL 17 Dataset/Run scientific closure rehearsal
        run: npx vitest run tests/investingGenesisI5DatasetRunScientificClosurePg17.test.ts

      - name: PostgreSQL 17 Research execution closure rehearsal
        run: npx vitest run tests/investingGenesisI5ResearchExecutionClosurePg17.test.ts

      - name: PostgreSQL 17 RL-2 Passport read rehearsal
        run: npx vitest run tests/investingGenesisI5Rl2ResearchPassportPg17.test.ts

      - name: PostgreSQL 17 RL-3B Validation child execution rehearsal
        run: npx vitest run tests/investingGenesisI5Rl3bValidationChildExecutionPg17.test.ts

      - name: PostgreSQL 17 RL-3C Validation aggregate physical rehearsal
        run: npx vitest run tests/investingGenesisI5Rl3cValidationAggregatePg17.test.ts

      - name: PostgreSQL 17 RL-3C Validation finalizer rehearsal
        run: npx vitest run tests/investingGenesisI5Rl3cValidationFinalizerPg17.test.ts

      - name: PostgreSQL 17 RL-3D Validation assessment rehearsal
        run: npx vitest run tests/investingGenesisI5Rl3dValidationAssessmentPg17.test.ts

      - name: PostgreSQL 17 RL-7 SQL and concrete writer commit/replay/rollback gates
        run: npx vitest run tests/investingGenesisI5Rl7ExperimentComparisonPg17.test.ts

      - name: PostgreSQL 17 RL-8C1 Scientific promotion schema authority rehearsal
        run: npx vitest run tests/investingGenesisI5Rl8c1ScientificPromotionPg17.test.ts

      - name: PostgreSQL 17 RL-8C2 Scientific promotion writer rehearsal
        run: npx vitest run tests/investingGenesisI5Rl8c2ScientificPromotionWritersPg17.test.ts

      - name: PostgreSQL 17 RL-8C3 Scientific promotion supersession rehearsal
        run: npx vitest run tests/investingGenesisI5Rl8c3ScientificPromotionSupersessionPg17.test.ts

      - name: Create isolated RL-9B PostgreSQL 17 databases
        run: |
          node <<'NODE'
          const { Client } = require("pg");
          const client = new Client({ connectionString: "postgresql://postgres:postgres@127.0.0.1:5432/postgres" });
          const databases = ["rl9b1_reconciliation", "rl9b2_reconciliation"];
          (async () => {
            await client.connect();
            for (const database of databases) {
              await client.query(`drop database if exists ${database} with (force)`);
              await client.query(`create database ${database}`);
            }
            await client.end();
          })().catch(async (error) => {
            console.error(error);
            await client.end().catch(() => undefined);
            process.exit(1);
          });
          NODE

      - name: PostgreSQL 17 RL-9B1 Blind Truth public metadata rehearsal
        env:
          PG17_RECONCILIATION_URL: postgresql://postgres:postgres@127.0.0.1:5432/rl9b1_reconciliation
        run: npx vitest run tests/investingGenesisI5Rl9b1BlindTruthPersistencePg17.test.ts

      - name: PostgreSQL 17 RL-9B2 Blind Truth writer rehearsal
        env:
          PG17_RECONCILIATION_URL: postgresql://postgres:postgres@127.0.0.1:5432/rl9b2_reconciliation
        run: npx vitest run tests/investingGenesisI5Rl9b2BlindTruthWritersPg17.test.ts

  investing-cumulative-compatibility-pg17:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      PG17_CUMULATIVE_COMPATIBILITY_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: PostgreSQL 17 cumulative compatibility rehearsal
        run: npx vitest run tests/investingGenesisCumulativeCompatibilityPg17.test.ts
