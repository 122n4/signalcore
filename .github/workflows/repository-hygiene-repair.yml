name: Repository Hygiene Repair

on:
  push:
    branches:
      - fix/i4c-contract-reconciliation-20260906

permissions:
  contents: write

env:
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuY2kuZHVtbXkk
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Apply isolated repairs
        run: python3 .github/repository-hygiene-repair.py
      - name: Reinstall repaired lock
        run: npm ci
      - name: Audit all dependencies
        run: npm audit --audit-level=low
      - name: Audit production dependencies
        run: npm run audit:prod
      - name: Verify repository
        run: npm run verify:ci
      - name: Check repair surface
        shell: bash
        run: |
          git diff --check
          git diff --stat
          git diff --name-only
      - name: Commit verified repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/ops/page.tsx app/ops/trades/page.tsx lib/signalcore/useDailyBundle.ts lib/trading/research/localArchiveInventory.ts package-lock.json
          git commit -m "fix: close repository lint and dev dependency debt"
          git push origin HEAD:fix/i4c-contract-reconciliation-20260906
