name: Repository Hygiene Repair

on:
  push:
    branches:
      - fix/i4c-contract-reconciliation-20260906

permissions:
  contents: write

env:
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuY2kuZHVtbXkk
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Apply exact lint repairs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly 1 match, got {count}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "app/ops/page.tsx",
              'import type { Metadata } from "next";\nimport { auth } from "@clerk/nextjs/server";',
              'import type { Metadata } from "next";\nimport Link from "next/link";\nimport { auth } from "@clerk/nextjs/server";',
          )
          replace_once(
              "app/ops/page.tsx",
              '''            <a
              href="/ops/trades"
              className="rounded-full border border-amber-200/30 bg-amber-300/10 px-4 py-2 text-sm font-bold text-amber-100 transition hover:bg-amber-300/15"
            >
              Trade Ledger
            </a>''',
              '''            <Link
              href="/ops/trades"
              className="rounded-full border border-amber-200/30 bg-amber-300/10 px-4 py-2 text-sm font-bold text-amber-100 transition hover:bg-amber-300/15"
            >
              Trade Ledger
            </Link>''',
          )

          replace_once(
              "app/ops/trades/page.tsx",
              'import type { Metadata } from "next";\nimport { auth } from "@clerk/nextjs/server";',
              'import type { Metadata } from "next";\nimport Link from "next/link";\nimport { auth } from "@clerk/nextjs/server";',
          )
          replace_once(
              "app/ops/trades/page.tsx",
              '''              <a href="/ops/trades" className="rounded-xl border border-white/10 px-4 py-2 text-sm font-bold text-white">
                Reset
              </a>''',
              '''              <Link href="/ops/trades" className="rounded-xl border border-white/10 px-4 py-2 text-sm font-bold text-white">
                Reset
              </Link>''',
          )

          replace_once(
              "lib/signalcore/useDailyBundle.ts",
              'import { useCallback, useEffect, useMemo, useState } from "react";',
              'import { useCallback, useEffect, useMemo, useReducer } from "react";',
          )
          replace_once(
              "lib/signalcore/useDailyBundle.ts",
              '''  const [snapshot, setSnapshot] = useState<DailyBundleSnapshot>(() => readModeSnapshot(mode));

  useEffect(() => {
    setSnapshot(readModeSnapshot(mode));

    const unsubscribe = subscribeToMode(mode, () => {
      setSnapshot(readModeSnapshot(mode));
    });

    const nextSnapshot = readModeSnapshot(mode);''',
              '''  const [, forceRender] = useReducer((count: number) => count + 1, 0);
  const snapshot = readModeSnapshot(mode);

  useEffect(() => {
    const unsubscribe = subscribeToMode(mode, forceRender);

    const nextSnapshot = readModeSnapshot(mode);''',
          )

          replace_once(
              "lib/trading/research/localArchiveInventory.ts",
              "  let sizeBytes = 0;",
              "  const sizeBytes = 0;",
          )
          PY
      - name: Refresh vulnerable dev transitive lock entries without force
        shell: bash
        run: |
          npm audit fix --package-lock-only
          npm ci
          npm audit --audit-level=low
          npm run audit:prod
      - name: Full repository verification
        run: npm run verify:ci
      - name: Prove only intended files changed
        shell: bash
        run: |
          git diff --check
          changed="$(git diff --name-only | sort)"
          printf '%s\n' "$changed"
          expected="$(printf '%s\n' \
            app/ops/page.tsx \
            app/ops/trades/page.tsx \
            lib/signalcore/useDailyBundle.ts \
            lib/trading/research/localArchiveInventory.ts \
            package-lock.json | sort)"
          test "$changed" = "$expected"
      - name: Commit verified hygiene repairs
        shell: bash
        run: |
          git diff --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/ops/page.tsx app/ops/trades/page.tsx lib/signalcore/useDailyBundle.ts lib/trading/research/localArchiveInventory.ts package-lock.json
          git commit -m "fix: close repository lint and dev dependency debt"
          git push origin HEAD:fix/i4c-contract-reconciliation-20260906
