name: Repository Hygiene Repair

on:
  push:
    branches:
      - fix/i4c-contract-reconciliation-20260906

permissions:
  contents: write

env:
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuY2kuZHVtbXkk
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Apply exact baseline repairs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly 1 match, got {count}")
              p.write_text(text.replace(old, new, 1))

          # Paper runner mocks: runtime contract gained reconcileCanonicalPaperTradeRuns.
          p = "tests/paperRunnerConcurrency.test.ts"
          replace_once(p,
              "  reconcileCanonicalPaperTrades: vi.fn(),\n  recordPaperTradeRun: vi.fn(),",
              "  reconcileCanonicalPaperTrades: vi.fn(),\n  reconcileCanonicalPaperTradeRuns: vi.fn(),\n  recordPaperTradeRun: vi.fn(),")
          replace_once(p,
              "  reconcileCanonicalPaperTrades: mocks.reconcileCanonicalPaperTrades,\n  recordPaperTradeRun: mocks.recordPaperTradeRun,",
              "  reconcileCanonicalPaperTrades: mocks.reconcileCanonicalPaperTrades,\n  reconcileCanonicalPaperTradeRuns: mocks.reconcileCanonicalPaperTradeRuns,\n  recordPaperTradeRun: mocks.recordPaperTradeRun,")
          replace_once(p,
              "    mocks.reconcileCanonicalPaperTrades.mockResolvedValue({ schemaReady: true, reconciled: 0, error: null });\n    mocks.settleCanonicalPaperRows",
              "    mocks.reconcileCanonicalPaperTrades.mockResolvedValue({ schemaReady: true, reconciled: 0, error: null });\n    mocks.reconcileCanonicalPaperTradeRuns.mockResolvedValue({ schemaReady: true, reconciled: 0, error: null });\n    mocks.settleCanonicalPaperRows")

          p = "tests/paperSignalExecutionContract.test.ts"
          replace_once(p,
              "  reconcileCanonicalPaperTrades: vi.fn(),\n  releasePaperTradeLock: vi.fn(),",
              "  reconcileCanonicalPaperTrades: vi.fn(),\n  reconcileCanonicalPaperTradeRuns: vi.fn(),\n  releasePaperTradeLock: vi.fn(),")
          replace_once(p,
              "  reconcileCanonicalPaperTrades: mocks.reconcileCanonicalPaperTrades,\n  recordPaperTradeRun: mocks.recordPaperTradeRun,",
              "  reconcileCanonicalPaperTrades: mocks.reconcileCanonicalPaperTrades,\n  reconcileCanonicalPaperTradeRuns: mocks.reconcileCanonicalPaperTradeRuns,\n  recordPaperTradeRun: mocks.recordPaperTradeRun,")
          replace_once(p,
              "    mocks.reconcileCanonicalPaperTrades.mockResolvedValue({\n      schemaReady: true,\n      error: null,\n      reconciled: 0,\n    });\n    mocks.settleCanonicalPaperRows",
              "    mocks.reconcileCanonicalPaperTrades.mockResolvedValue({\n      schemaReady: true,\n      error: null,\n      reconciled: 0,\n    });\n    mocks.reconcileCanonicalPaperTradeRuns.mockResolvedValue({\n      schemaReady: true,\n      error: null,\n      reconciled: 0,\n    });\n    mocks.settleCanonicalPaperRows")

          # Explicit [] means staged-only; only undefined means default active instruments.
          replace_once("lib/trading/research/marketDataBackfill.ts",
              "  const activeInstruments = (args.instruments?.length ? args.instruments : config.study.instruments)",
              "  const activeInstruments = (args.instruments !== undefined ? args.instruments : config.study.instruments)")

          # Runtime artifact paths are OS-portable; test must use the same contract.
          replace_once("tests/tradingResearchRuntimeHealth.test.ts",
              '    const statusPath = `${config.paths.runsDir}\\\\run-runtime-canonical\\\\status.json`;',
              '    const statusPath = path.join(config.paths.runsDir, "run-runtime-canonical", "status.json");')
          PY
      - name: Targeted six-failure verification
        run: >-
          npx vitest run
          tests/paperRunnerConcurrency.test.ts
          tests/paperSignalExecutionContract.test.ts
          tests/tradingMarketDataBackfill.test.ts
          tests/tradingResearchRuntimeHealth.test.ts
      - name: Capture global lint debt
        shell: bash
        run: |
          set +e
          npm run lint
          echo "LINT_EXIT=$?"
          exit 0
      - name: Capture full npm advisory graph
        shell: bash
        run: |
          set +e
          npm audit --json > /tmp/npm-audit.json
          audit_status=$?
          node - <<'NODE'
          const fs = require('fs');
          const x = JSON.parse(fs.readFileSync('/tmp/npm-audit.json','utf8'));
          console.log('AUDIT_METADATA=' + JSON.stringify(x.metadata?.vulnerabilities ?? null));
          const rows = Object.entries(x.vulnerabilities ?? {}).map(([name,v]) => ({
            name,
            severity: v.severity,
            direct: v.isDirect,
            via: (v.via ?? []).map(z => typeof z === 'string' ? z : {source:z.source,name:z.name,severity:z.severity,title:z.title,range:z.range}),
            range: v.range,
            fixAvailable: v.fixAvailable,
          }));
          console.log('AUDIT_VULNERABILITIES=' + JSON.stringify(rows));
          NODE
          echo "AUDIT_EXIT=$audit_status"
          exit 0
      - name: Commit verified repairs
        shell: bash
        run: |
          git diff --check
          git diff --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/paperRunnerConcurrency.test.ts tests/paperSignalExecutionContract.test.ts lib/trading/research/marketDataBackfill.ts tests/tradingResearchRuntimeHealth.test.ts
          if git diff --cached --quiet; then
            echo "No repair changes to commit"
            exit 0
          fi
          git commit -m "fix: clear canonical repository test baseline"
          git push origin HEAD:fix/i4c-contract-reconciliation-20260906
