name: Temporary RL3D remediation migration generator

on:
  push:
    branches:
      - automation/rl3d-postapply-performance-migration-name-20260930

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/rl3d-postapply-performance-migration-name-20260930
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate migration with Supabase CLI
        run: npx --yes supabase@latest migration new investing_i5_rl3d_postapply_performance_remediation
      - name: Commit generated migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations
          git diff --cached --exit-code && exit 0
          git commit -m "chore: generate RL-3D postapply performance remediation migration"
          git push origin HEAD:automation/rl3d-postapply-performance-migration-name-20260930
