name: Temporary I4-B policy fingerprint patch

on:
  push:
    branches:
      - fix/investing-genesis-rehearsal-gates-20260905
    paths:
      - .github/workflows/temporary-i4b-policy-fingerprint-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/investing-genesis-rehearsal-gates-20260905
      - name: Patch exact I4-B policy fingerprints
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/investing-genesis/sql/I4B_PLAN_PERSISTENCE_CANDIDATE.sql')
          text = path.read_text()

          replacements = [
              (
                  """        and expr.check_expr ~ 'i3_internal_paper_fill_accounting_v1'\n        and expr.check_expr ~ 'ledger_write'\n        and expr.check_expr ~ 'started'\n        and expr.check_expr ~ 'material_request_hash')""",
                  """        and expr.check_expr ~ 'i3_internal_paper_fill_accounting_v1'\n        and expr.check_expr ~ 'i3_accounting_write'\n        and expr.check_expr ~ 'started'\n        and expr.check_expr ~ 'material_request_hash')""",
              ),
              (
                  """        and expr.using_expr ~ 'i3_internal_paper_fill_accounting_v1'\n        and expr.using_expr ~ 'ledger_write'\n        and expr.check_expr ~ 'succeeded'\n        and expr.check_expr ~ 'canonical_result_reference')""",
                  """        and expr.using_expr ~ 'i3_internal_paper_fill_accounting_v1'\n        and expr.using_expr ~ 'i3_accounting_write'\n        and expr.using_expr ~ 'started'\n        and expr.check_expr ~ 'succeeded')""",
              ),
              (
                  """        and expr.check_expr ~ 'buy'\n        and expr.check_expr ~ 'sell'\n        and expr.check_expr ~ 'source_sequence')""",
                  """        and expr.check_expr ~ 'i3_internal_paper_fill_accounting_v1'\n        and expr.check_expr ~ 'i3_accounting_write'\n        and expr.check_expr ~ 'source_sequence'\n        and expr.check_expr ~ 'material_request_hash')""",
              ),
              (
                  """        and expr.check_expr ~ 'pending'\n        and expr.check_expr ~ 'event_count'\n        and expr.check_expr ~ 'event_set_hash')""",
                  """        and expr.check_expr ~ 'i3_accounting_write'\n        and expr.check_expr ~ 'disposal_fifo_v1'\n        and expr.check_expr ~ 'supersedes_accounting_revision_id'\n        and expr.check_expr ~ 'accounting_revision_id')""",
              ),
              (
                  """        and expr.check_expr ~ 'event_count'\n        and expr.check_expr ~ 'event_set_hash')""",
                  """        and expr.check_expr ~ 'i3_accounting_write'\n        and expr.check_expr ~ 'accounting_revision_id'\n        and expr.check_expr ~ 'fill_id')""",
              ),
              (
                  """        and expr.check_expr ~ 'securities_book_cost_asset'\n        and expr.check_expr ~ 'trading_fee_expense'\n        and expr.check_expr ~ 'realized_gain_loss')""",
                  """        and expr.check_expr ~ 'i3_accounting_write'\n        and expr.check_expr ~ 'ledger_transaction_id'\n        and expr.check_expr ~ 'settlement_currency')""",
              ),
              (
                  """      or (c.relname = 'ledger_transaction_seals'\n        and p.polname = 'ledger_transaction_seals_i3c_accounting_insert'\n        and p.polcmd = 'a'\n        and expr.check_expr ~ 'ledger_transactions')""",
                  """      or (c.relname = 'ledger_transaction_seals'\n        and p.polname = 'ledger_transaction_seals_i3c_accounting_insert'\n        and p.polcmd = 'a'\n        and expr.check_expr ~ 'i3_accounting_write'\n        and expr.check_expr ~ 'ledger_transaction_id'\n        and expr.check_expr ~ 'account_access')""",
              ),
          ]

          for index, (old, new) in enumerate(replacements, start=1):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'replacement {index}: expected exact old text once, found {count}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY
      - name: Commit exact patch
        shell: bash
        run: |
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "docs/investing-genesis/sql/I4B_PLAN_PERSISTENCE_CANDIDATE.sql"
          git diff -- docs/investing-genesis/sql/I4B_PLAN_PERSISTENCE_CANDIDATE.sql
          git config user.name '122n4'
          git config user.email '112497100+122n4@users.noreply.github.com'
          git add docs/investing-genesis/sql/I4B_PLAN_PERSISTENCE_CANDIDATE.sql
          git commit -m 'fix(investing): align I4-B policy fingerprints with I3-C'
          git push origin HEAD:fix/investing-genesis-rehearsal-gates-20260905
