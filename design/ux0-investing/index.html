<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Syntrake Investing — UX-T1R human-first prototype</title>
  <link rel="stylesheet" href="prototype.css?v=t1r-1">
</head>
<body>
  <div class="prototype-bar" aria-label="Prototype controls">
    <span><b>UX-T1R</b> human-first · isolated prototype</span>
    <label>State
      <select id="state-switcher">
        <option value="new_user_unclassified">New user</option>
        <option value="no_portfolio_no_plan">No portfolio · no plan</option>
        <option value="plan_setup_in_progress">Plan setup</option>
        <option value="plan_ready_no_portfolio">Plan ready · no portfolio</option>
        <option value="paper_portfolio_active">Paper portfolio</option>
        <option value="data_incomplete">Insufficient data</option>
        <option value="data_stale">Stale data</option>
        <option value="latest_evaluation_no_engine_blocker">No issue in scoped check</option>
        <option value="attention_required" selected>Attention required</option>
        <option value="engine_decision_recorded">Recorded check</option>
        <option value="unavailable">Unavailable</option>
      </select>
    </label>
  </div>

  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#home" data-view-link="home" aria-label="Syntrake Investing home">
        <span class="brand-mark">S</span><span>Syntrake</span>
      </a>
      <div class="product-label">Investing</div>
      <nav class="main-nav" aria-label="Investing navigation"></nav>
      <span class="settings-link" aria-disabled="true"><span class="nav-icon">◎</span><span>Static example</span></span>
      <div class="paper-note"><span class="status-dot"></span><div><b>Paper environment</b><small>No real money connected</small></div></div>
    </aside>

    <main id="main" tabindex="-1">
      <header class="mobile-header">
        <a class="brand" href="#home" data-view-link="home"><span class="brand-mark">S</span><span>Syntrake</span></a>
        <span class="paper-chip">Paper</span>
      </header>
      <div id="page" aria-live="polite"></div>
    </main>
  </div>
  <nav class="mobile-nav" aria-label="Investing mobile navigation"></nav>
  <script src="prototype.js?v=t1r-1"></script>
</body>
</html>
