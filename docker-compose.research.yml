services:
  research-supervisor:
    build:
      context: .
      dockerfile: Dockerfile.research
    container_name: syntrake-research-supervisor
    restart: unless-stopped
    env_file:
      - .env.research
    environment:
      NODE_ENV: production
      RESEARCH_SUPABASE_SYNC: "1"
    volumes:
      - ./artifacts:/app/artifacts
      - ./data:/app/data
      - ./config:/app/config
    command: ["npm", "run", "research:supervisor"]

  research-sync:
    build:
      context: .
      dockerfile: Dockerfile.research
    container_name: syntrake-research-sync
    restart: unless-stopped
    env_file:
      - .env.research
    environment:
      NODE_ENV: production
      RESEARCH_SUPABASE_SYNC: "1"
    volumes:
      - ./artifacts:/app/artifacts
      - ./data:/app/data
      - ./config:/app/config
    command: ["npm", "run", "research:sync:loop", "--", "--intervalSeconds=60"]

  research-backfill:
    build:
      context: .
      dockerfile: Dockerfile.research
    container_name: syntrake-research-backfill
    restart: unless-stopped
    env_file:
      - .env.research
    environment:
      NODE_ENV: production
      RESEARCH_SUPABASE_SYNC: "1"
    volumes:
      - ./artifacts:/app/artifacts
      - ./data:/app/data
      - ./config:/app/config
    command: ["npm", "run", "research:data-backfill:loop", "--", "--intervalMinutes=360"]
