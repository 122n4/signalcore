<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Syntrake - Offline</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }
      .card {
        width: min(92vw, 460px);
        border: 1px solid #cbd5e1;
        border-radius: 16px;
        background: #ffffff;
        padding: 20px;
        box-shadow: 0 8px 32px rgba(15, 23, 42, 0.08);
      }
      h1 {
        margin: 0 0 10px;
        font-size: 20px;
      }
      p {
        margin: 0 0 12px;
        line-height: 1.5;
        font-size: 14px;
      }
      button {
        border: 0;
        border-radius: 999px;
        padding: 10px 14px;
        background: #0f172a;
        color: #ffffff;
        cursor: pointer;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>You are offline</h1>
      <p>Syntrake needs an internet connection for live market and account data.</p>
      <p>Reconnect and tap retry.</p>
      <button type="button" onclick="location.reload()">Retry</button>
    </main>
  </body>
</html>
